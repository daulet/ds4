[package]
name = "ds4-cuda"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
cuda-core = { git = "https://github.com/daulet/cuda-oxide", rev = "485bdd86fc1c900ad15ebd421b3b187619fe0903", optional = true }
cuda-device = { git = "https://github.com/daulet/cuda-oxide", rev = "485bdd86fc1c900ad15ebd421b3b187619fe0903", optional = true }
cuda-host = { git = "https://github.com/daulet/cuda-oxide", rev = "485bdd86fc1c900ad15ebd421b3b187619fe0903", optional = true }
libc = { version = "0.2", optional = true }

[features]
default = []
cuda-oxide-backend = ["dep:cuda-core", "dep:libc"]
cuda-oxide-kernels = ["cuda-oxide-backend", "dep:cuda-device", "dep:cuda-host"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ds4-cuda-substrate-smoke"
path = "src/bin/substrate_smoke.rs"
required-features = ["cuda-oxide-backend"]

