[package]
name = "ds4-cuda"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
cuda-core = { git = "https://github.com/daulet/cuda-oxide", rev = "aabe10dc4fa0086375104458909e222d1ac1cfe3", optional = true }
cuda-device = { git = "https://github.com/daulet/cuda-oxide", rev = "aabe10dc4fa0086375104458909e222d1ac1cfe3", optional = true }
cuda-host = { git = "https://github.com/daulet/cuda-oxide", rev = "aabe10dc4fa0086375104458909e222d1ac1cfe3", optional = true }
libc = { version = "0.2", optional = true }

[features]
default = []
cuda-oxide-backend = ["dep:cuda-core", "dep:libc"]
cuda-oxide-kernels = ["cuda-oxide-backend", "dep:cuda-device", "dep:cuda-host"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ds4-cuda-substrate-smoke"
path = "src/bin/substrate_smoke.rs"
required-features = ["cuda-oxide-backend"]

[[bin]]
name = "ds4-cuda-model-residency-smoke"
path = "src/bin/model_residency_smoke.rs"
required-features = ["cuda-oxide-backend"]

[[bin]]
name = "ds4-cuda-model-range-copy-smoke"
path = "src/bin/model_range_copy_smoke.rs"
required-features = ["cuda-oxide-backend"]

[[bin]]
name = "ds4-cuda-model-range-strategy-smoke"
path = "src/bin/model_range_strategy_smoke.rs"
required-features = ["cuda-oxide-backend"]

[[bin]]
name = "ds4-cuda-model-registered-range-smoke"
path = "src/bin/model_registered_range_smoke.rs"
required-features = ["cuda-oxide-backend"]

[[bin]]
name = "ds4-cuda-model-pageable-hmm-smoke"
path = "src/bin/model_pageable_hmm_smoke.rs"
required-features = ["cuda-oxide-backend"]

[[bin]]
name = "ds4-cuda-model-direct-io-smoke"
path = "src/bin/model_direct_io_smoke.rs"
required-features = ["cuda-oxide-backend"]

[[bin]]
name = "ds4-cuda-model-async-staging-smoke"
path = "src/bin/model_async_staging_smoke.rs"
