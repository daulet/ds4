[package]
name = "ds4-cuda"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
cuda-core = { git = "https://github.com/daulet/cuda-oxide", rev = "d4791b7002152af3b7f6b15a48d7f5acd7a63011", optional = true }
cuda-device = { git = "https://github.com/daulet/cuda-oxide", rev = "d4791b7002152af3b7f6b15a48d7f5acd7a63011", optional = true }
cuda-host = { git = "https://github.com/daulet/cuda-oxide", rev = "d4791b7002152af3b7f6b15a48d7f5acd7a63011", optional = true }
libc = { version = "0.2", optional = true }

[features]
default = []
cuda-oxide-backend = ["dep:cuda-core", "dep:libc"]
cuda-oxide-kernels = ["cuda-oxide-backend", "dep:cuda-device", "dep:cuda-host"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ds4-cuda-substrate-smoke"
path = "src/bin/substrate_smoke.rs"
required-features = ["cuda-oxide-backend"]

[[bin]]
name = "ds4-cuda-model-residency-smoke"
path = "src/bin/model_residency_smoke.rs"
required-features = ["cuda-oxide-backend"]

